        function buildSearchIndex() {
            const index = [];
            SUBJECTS.forEach(sub => {
                // Thêm môn học
                index.push({
                    type: 'Môn học',
                    subjectId: sub.id,
                    subjectName: sub.name,
                    tab: 'theory',
                    title: `Môn ${sub.name} Lớp 8`,
                    snippet: sub.desc
                });
                // Thêm các bài lý thuyết
                sub.theory.forEach(th => {
                    const cleanText = th.points.join(' ').replace(/<[^>]*>/g, '');
                    index.push({
                        type: 'Lý thuyết',
                        subjectId: sub.id,
                        subjectName: sub.name,
                        tab: 'theory',
                        theoryId: th.id,
                        title: th.title,
                        snippet: `${th.chapter} — ${th.summary}`,
                        fullText: `${th.title} ${th.chapter} ${th.summary} ${cleanText}`.toLowerCase()
                    });
                });
                // Thêm tài liệu PDF
                sub.docs.forEach(doc => {
                    index.push({
                        type: 'Tài liệu PDF',
                        subjectId: sub.id,
                        subjectName: sub.name,
                        tab: 'docs',
                        title: doc.title,
                        snippet: `${doc.type} • ${doc.pages} (${doc.size})`,
                        fullText: `${doc.title} ${doc.type}`.toLowerCase()
                    });
                });
            });
            return index;
        }

                return;

                const target = item.fullText || `${item.title} ${item.snippet}`.toLowerCase();
                return target.includes(kw);
            }).slice(0, 8);

            dropdown.classList.remove('hidden');
            if (matches.length === 0) {
                dropdown.innerHTML = `

        function downloadStudyMaterial(subId, docIdx) {
            const sub = SUBJECTS.find(s => s.id === subId);
            if (!sub) return;
            const doc = sub.docs[docIdx];

            // Tạo nội dung tóm tắt tài liệu ôn tập thực tế để tải về máy học sinh
            const lines = [
                '====================================================================',
                `HỌC TỐT LỚP 8 - CHƯƠNG TRÌNH GDPT 2018`,
                `MÔN HỌC: ${sub.name.toUpperCase()}`,
                `TÀI LIỆU: ${doc.title}`,
                `Thông tin: ${doc.type} | ${doc.pages} | ${doc.size}`,
                '====================================================================\n',
                'I. TÓM TẮT KIẾN THỨC TRỌNG TÂM:\n'
            ];

            sub.theory.forEach((th, i) => {
                lines.push(`${i + 1}. ${th.title} (${th.chapter})`);
                lines.push(`   Tóm tắt: ${th.summary}`);
                th.points.forEach(p => {
                    lines.push(`   - ${p.replace(/<[^>]*>/g, '')}`);
                });
                lines.push('');
            });

            lines.push('II. CÂU HỎI TỰ LUYỆN & ĐÁP ÁN CHI TIẾT:\n');
            sub.quiz.forEach((q, i) => {
                lines.push(`Câu ${i + 1}: ${q.q}`);
                ['A', 'B', 'C', 'D'].forEach((ltr, oIdx) => {
                    lines.push(`   ${ltr}. ${q.options[oIdx]}`);
                });
                lines.push(`   => Đáp án đúng: ${['A', 'B', 'C', 'D'][q.ans]}`);
                lines.push(`   => Giải thích: ${q.exp}\n`);
            });

            const blob = new Blob([lines.join('\n')], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const safeSlug = sub.id + '_tai_lieu_on_tap_lop_8.txt';
            a.href = url;
            a.download = safeSlug;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showToast(`Đã tải xuống tài liệu "${doc.title}" thành công!`);
        }

                            </p>
                            <span class="text-xs font-bold px-3 py-1 rounded-full bg-teal-50 text-teal-700 border border-teal-200">
                                Đã chọn: ${answeredCount}/${totalQ} câu
                            </span>
                        </div>
                    `}

                    <!-- Danh sách câu hỏi -->
                    <div class="space-y-4">
                        ${sub.quiz.map((q, qIdx) => {
                            const userChoice = subAnswers[qIdx];
                            const hasChosen = userChoice !== undefined;
                            const isCorrect = hasChosen && userChoice === q.ans;

                            let cardBorder = 'border-slate-200/90';
                            if (isSubmitted) {
                                cardBorder = isCorrect ? 'border-emerald-400 ring-1 ring-emerald-400/40' : 'border-rose-400 ring-1 ring-rose-400/40';
                            }

                            return `
                                <div class="bg-white rounded-2xl p-5 sm:p-6 border ${cardBorder} shadow-sm transition-all">
                                    <div class="flex items-center justify-between gap-2 mb-3">
                                        <span class="px-3 py-1 rounded-lg bg-teal-50 text-teal-700 font-extrabold text-xs">
                                            Câu ${qIdx + 1}
                                        </span>
                                        ${isSubmitted ? (
                                            isCorrect
                                                ? `<span class="text-xs font-bold px-2.5 py-1 rounded-md bg-emerald-100 text-emerald-700">✓ Chính xác</span>`
                                                : `<span class="text-xs font-bold px-2.5 py-1 rounded-md bg-rose-100 text-rose-700">${hasChosen ? '✕ Chưa đúng' : 'Chưa chọn đáp án'}</span>`
                                        ) : ''}
                                    </div>

                                    <p class="font-bold text-sm sm:text-base text-slate-800 leading-relaxed mb-4">
                                        ${q.q}
                                    </p>

                                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                                        ${q.options.map((optText, oIdx) => {
                                            let optClass = 'bg-slate-50 border-slate-200 text-slate-700 hover:bg-teal-50/60 hover:border-teal-300';
                                            let badgeClass = 'bg-white border-slate-300 text-slate-600';

                                            if (!isSubmitted) {
                                                if (userChoice === oIdx) {
                                                    optClass = 'bg-teal-50 border-teal-600 text-teal-900 font-semibold ring-1 ring-teal-600/30';
                                                    badgeClass = 'bg-teal-600 border-teal-600 text-white';
                                                }
                                            } else {
                                                if (oIdx === q.ans) {
                                                    optClass = 'bg-emerald-50 border-emerald-500 text-emerald-900 font-bold';
                                                    badgeClass = 'bg-emerald-500 border-emerald-500 text-white';
                                                } else if (oIdx === userChoice && userChoice !== q.ans) {
                                                    optClass = 'bg-rose-50 border-rose-500 text-rose-900 font-semibold';
                                                    badgeClass = 'bg-rose-500 border-rose-500 text-white';
                                                } else {
                                                    optClass = 'bg-slate-50/70 border-slate-200 text-slate-400';
                                                }
                                            }

                                            return `
                                                <button type="button" ${isSubmitted ? 'disabled' : ''}
                                                    onclick="selectQuizOption('${sub.id}', ${qIdx}, ${oIdx})"
                                                    class="w-full text-left p-3.5 rounded-xl border transition-all flex items-start gap-3 ${optClass}">
                                                    <span class="w-7 h-7 rounded-lg border flex items-center justify-center text-xs font-extrabold shrink-0 ${badgeClass}">
                                                        ${letters[oIdx]}
                                                    </span>
                                                    <span class="text-sm leading-snug pt-0.5">${optText}</span>
                                                </button>
                                            `;
                                        }).join('')}
                                    </div>

                                    <!-- Khung Giải thích chi tiết (hiện sau khi nộp bài) -->
                                    ${isSubmitted ? `
                                        <div class="mt-4 p-4 rounded-xl bg-sky-50/90 border border-sky-200 text-sky-950 text-xs sm:text-sm leading-relaxed animate-fade-in">
                                            <div class="font-extrabold text-sky-800 mb-1 flex items-center gap-1.5">
                                                <span>💡 Giải thích chi tiết (Đáp án đúng: ${letters[q.ans]}):</span>
                                            </div>
                                            <p>${q.exp}</p>
                                        </div>
                                    ` : ''}
                                </div>
                            `;
                        }).join('')}
                    </div>

                    <!-- Thanh nút Nộp bài / Làm lại bài -->
                    <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200/90 shadow-sm flex flex-wrap items-center justify-between gap-3">
                        <span class="text-xs sm:text-sm text-slate-500">
                            ${isSubmitted ? 'Bạn có thể bấm "Làm lại bài" để thử sức lại từ đầu.' : `Hoàn thành ${answeredCount}/${totalQ} câu hỏi.`}
                        </span>
                        <div class="flex items-center gap-3">
                            ${isSubmitted ? `
                                <button onclick="resetSubjectQuiz('${sub.id}')"
                                    class="px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-600 text-white font-bold text-sm shadow-sm transition-all">
                                    🔄 Làm lại bài
                                </button>
                            ` : `
                                <button onclick="submitSubjectQuiz('${sub.id}')"
                                    class="px-6 py-2.5 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-bold text-sm shadow-md shadow-teal-600/20 transition-all active:scale-95">
                                    ✅ Nộp bài &amp; Chấm điểm
                                </button>
                            `}
                        </div>
                    </div>
                </div>
            `;
        }

        function selectQuizOption(subId, qIdx, oIdx) {
            if (appState.quizSubmitted[subId]) return;
            if (!appState.quizAnswers[subId]) {
                appState.quizAnswers[subId] = {};
            }
            appState.quizAnswers[subId][qIdx] = oIdx;
            renderContent();
        }

        function submitSubjectQuiz(subId) {
            const sub = SUBJECTS.find(s => s.id === subId);
            if (!sub) return;
            const ansObj = appState.quizAnswers[subId] || {};
            if (Object.keys(ansObj).length === 0) {
                showToast('Bạn hãy chọn ít nhất 1 đáp án trước khi bấm Nộp bài nhé!', 'warning');
                return;
            }
            appState.quizSubmitted[subId] = true;
            renderContent();
            window.scrollTo({ top: 180, behavior: 'smooth' });
        }

        function resetSubjectQuiz(subId) {
            appState.quizAnswers[subId] = {};
            appState.quizSubmitted[subId] = false;
            renderContent();
        }

        // ---------------------------------------------------------------------
        // 7. RENDER CHÍNH & TOAST THÔNG BÁO
        // ---------------------------------------------------------------------
        function renderContent() {
            const container = document.getElementById('app-content');
            if (appState.currentView === 'home') {
                container.innerHTML = renderHomeView();
            } else {
                const sub = SUBJECTS.find(s => s.id === appState.currentView);
                if (sub) {
                    container.innerHTML = renderSubjectView(sub);
                }
            }
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgClass = type === 'warning'
                ? 'bg-amber-600 text-white'
                : 'bg-teal-700 text-white';

            toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-xl text-xs sm:text-sm font-semibold animate-fade-in ${bgClass}`;
            toast.innerHTML = `
                <span>${type === 'warning' ? '⚠️' : '✅'}</span>
                <span>${message}</span>
            `;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        }

        // Khởi chạy ứng dụng
        window.addEventListener('DOMContentLoaded', () => {
            renderNavigation();
            renderContent();
        });
    </script>
</body>
</html>
